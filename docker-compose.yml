version: '3.8'
services:
  db:
    image: postgres:17
    container_name: bank_istad_db
    restart: always
    environment:
      POSTGRES_DB: bank_istad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supermatra
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
